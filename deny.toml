# Dependency policy, also consumed by scripts/licensing/cargo_notices.py.
# Non-license checks retain their existing effective configuration.
[graph]
targets = []

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
# Preserve exceptions at crate scope rather than globally allowing OpenSSL/CDLA.
exceptions = [
    { name = "aws-lc-sys", version = "*", allow = ["OpenSSL"] },
    { name = "webpki-root-certs", version = "*", allow = ["CDLA-Permissive-2.0"] },
    { name = "webpki-roots", version = "*", allow = ["CDLA-Permissive-2.0"] },
    { name = "zerovec-derive", version = "*", allow = ["Unicode-3.0"] },
]
# Cargo.lock selects ring 0.17.14, whose published metadata is Apache-2.0 AND ISC.
# Remove the stale MIT AND ISC AND OpenSSL clarification for older ring material.
# Preserve ring's actual LICENSE, LICENSE-other-bits, LICENSE-BoringSSL and nested
# legal files in the notice bundle; do not substitute one generic license text.
# Evidence: https://docs.rs/crate/ring/0.17.14/source/Cargo.toml.orig

[licenses.private]
# Existing workspace-wide cargo-deny policy retained. Notice generation separately
# includes private/local crates in each selected distributable binary's graph.
ignore = true
registries = []

[bans]
multiple-versions = "warn"
# Existing advisory/bans behavior is not changed as part of license remediation.
wildcards = "allow"
highlight = "all"
deny = []
skip = [
    { name = "bitflags" },
    { name = "core-foundation" },
    { name = "getrandom" },
    { name = "hashbrown" },
    { name = "nix" },
    { name = "openssl-probe" },
    { name = "reqwest" },
    { name = "reqwest-middleware" },
    { name = "security-framework" },
    { name = "thiserror" },
    { name = "thiserror-impl" },
    { name = "windows-sys" },
    { name = "windows-targets" },
    { name = "windows_aarch64_gnullvm" },
    { name = "windows_aarch64_msvc" },
    { name = "windows_i686_gnu" },
    { name = "windows_i686_gnullvm" },
    { name = "windows_i686_msvc" },
    { name = "windows_x86_64_gnu" },
    { name = "windows_x86_64_gnullvm" },
    { name = "windows_x86_64_msvc" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/rybskiworks/libkrun",
    "https://github.com/superradcompany/rust-vmm",
    "https://github.com/toksdotdev/rust-oci-client",
    "https://github.com/youki-dev/oci-spec-rs",
]
